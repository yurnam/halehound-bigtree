; ═══════════════════════════════════════════════════════════════════════════
; HaleHound-CYD PlatformIO Configuration
; ESP32-DIV HaleHound Edition for Cheap Yellow Display
; Created: 2026-02-07
; ═══════════════════════════════════════════════════════════════════════════

[platformio]
src_dir = .

[env]
build_src_filter = +<*> -<_v29_backup/>

[env:esp32-cyd]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800

; CYD 2.8" uses CH340 USB-Serial
upload_port = /dev/cu.usbserial-*

; Build flags
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DBOARD_HAS_PSRAM=0
    ; TFT_eSPI uses our custom User_Setup.h in project folder
    -DUSER_SETUP_LOADED
    -include User_Setup.h
    ; Allow override of SDK functions (deauth) and resolve SPI conflicts
    -Wl,--allow-multiple-definition
    ; RF24 library: enable 95ms timeout in write()/writeFast() to prevent infinite loops
    -DFAILURE_HANDLING

; Required libraries
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    bblanchon/ArduinoJson@^7.0.0
    mikalhart/TinyGPSPlus@^1.0.3
    plerup/EspSoftwareSerial@^8.2.0
    sui77/rc-switch@^2.6.4
    kosme/arduinoFFT@^2.0.2
    nrf24/RF24@1.4.11
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git
    lsatan/SmartRC-CC1101-Driver-Lib@^2.5.7
    adafruit/Adafruit PN532@^1.3.3
    t-vk/ESP32 BLE Keyboard@^0.3.2

; Partition scheme - need more space for this firmware
board_build.partitions = huge_app.csv

; Flash mode
board_build.flash_mode = dio
board_build.f_flash = 40000000L

; Monitor filters
monitor_filters = esp32_exception_decoder

; ═══════════════════════════════════════════════════════════════════════════
; NM-RF-Hat Build Target
; Uses GPIO 22 + GPIO 27 for both CC1101 and NRF24 (physical switch selects)
; One radio at a time — hat enforces this in hardware
; ═══════════════════════════════════════════════════════════════════════════

[env:esp32-cyd-hat]
extends = env:esp32-cyd
build_flags =
    ${env:esp32-cyd.build_flags}
    -DNMRF_HAT=1

; ═══════════════════════════════════════════════════════════════════════════
; QDtech E32R28T Build Target (2.8" ILI9341, Type-C, Battery)
; Same display/touch as CYD 2.8" — pin swaps for SC8002B amp on GPIO 4:
;   NRF24_CSN: GPIO 4 → GPIO 26 (DAC pad, amp shut down)
;   CC1101_TX_EN: GPIO 26 → GPIO 4 (amp enable doubles as PA TX_EN)
; Radios: E07-433M20S (CC1101+PA) + E01-2G4M27SX (NRF24 27dBm)
; ═══════════════════════════════════════════════════════════════════════════

[env:esp32-e32r28t]
extends = env:esp32-cyd
build_flags =
    ${env:esp32-cyd.build_flags}
    -DCYD_E32R28T=1

; ═══════════════════════════════════════════════════════════════════════════
; QDtech E32R35T Build Target
; 3.5" ST7796 320x480, XPT2046 resistive touch (shared HSPI with LCD)
; CC1101 CS on GPIO 21 (SPI peripheral connector)
; ═══════════════════════════════════════════════════════════════════════════

[env:esp32-e32r35t]
extends = env:esp32-cyd
build_flags =
    ${env:esp32-cyd.build_flags}
    -DCYD_E32R35T=1

; ═══════════════════════════════════════════════════════════════════════════
; BigTreeTech PandaTouch Build Target
; ESP32-S3 — 5" 800×480 RGB-parallel LCD — GT911 capacitive touch
; WiFi + Bluetooth only (no SPI radio modules — insufficient free GPIOs)
;
; The TFT_eSPI library is kept in lib_deps so that  #include <TFT_eSPI.h>
; resolves at the file-system level.  pt_tft_compat.h (pre-included via
; build_src_flags so it applies only to project source files, not libraries)
; defines the _TFT_eSPIH_ guard (the actual guard in TFT_eSPI.h v2.5.43) and
; provides an Arduino_GFX-backed replacement class of the same name.
; ═══════════════════════════════════════════════════════════════════════════

[env:pandatouch]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 460800
upload_port = /dev/ttyUSB0

build_flags =
    ; Board identity
    -DPANDATOUCH=1
    -DCORE_DEBUG_LEVEL=1
    -DBOARD_HAS_PSRAM=1
    ; Resolve duplicate symbols across compilation units
    -Wl,--allow-multiple-definition
    ; RF24: enable timeout in write()/writeFast() (library still compiles; radio disabled at runtime)
    -DFAILURE_HANDLING

; build_src_flags applies only to project source files — NOT to library files
; in .pio/libdeps/.  This prevents the shim (which needs Arduino_GFX_Library.h
; in its include path) from being pre-included into library TUs that don't
; have that path, which would cause fatal "no such file" errors.
; The shim defines _TFT_eSPIH_ (the real TFT_eSPI.h v2.5.43 header guard)
; so that any  #include <TFT_eSPI.h>  in project source files is blocked and
; our Arduino_GFX-backed TFT_eSPI class is used instead.
build_src_flags =
    -include pt_tft_compat.h

; Exclude GFX library source files that don't compile for this target
extra_scripts = pre:build_files_exclude.py
custom_build_files_exclude = */Arduino_ESP32LCD8.cpp */Arduino_ESP32QSPI.cpp

lib_deps =
    ; TFT_eSPI kept for font file paths (Fonts/GFXFF/*.h) and #include resolution
    bodmer/TFT_eSPI@^2.5.43
    ; Display + touch — 1.6.1 uses proper esp_lcd_panel_rgb API for all core versions,
    ; fixing Cache_WriteBack_Addr ROM breakage in ESP-IDF 5.3.x; adds bounce_buffer_size_px
    moononournation/GFX Library for Arduino@1.6.1
    tamctec/TAMC_GT911@1.0.2
    ; Shared utility / attack libraries
    bblanchon/ArduinoJson@^7.0.0
    mikalhart/TinyGPSPlus@^1.0.3
    plerup/EspSoftwareSerial@^8.2.0
    sui77/rc-switch@^2.6.4
    kosme/arduinoFFT@^2.0.2
    nrf24/RF24@1.4.11
    lsatan/SmartRC-CC1101-Driver-Lib@^2.5.7
    adafruit/Adafruit PN532@^1.3.3
    t-vk/ESP32 BLE Keyboard@^0.3.2

; ESP32-S3 with 16 MB flash and OPI PSRAM
board_build.arduino.memory_type = qio_opi
board_build.f_flash = 80000000L
board_build.flash_mode = qio
; 16 MB flash — override the board default of 8 MB
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
monitor_filters = esp32_exception_decoder
